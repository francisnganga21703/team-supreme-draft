<script>
(function(){
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT; const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);};
const S={db:null,sb:null,authUser:null,gate:true,admin:false,uid:null,email:null,canWrite:true,readOnly:false,config:null,roster:[],weeks:{},weekId:null,view:'board',me:null,loaded:false,confirm:null,editRoster:false,editLayout:false};


// ---------- helpers ----------
const person=id=>S.roster.find(p=>p.id===id);
const pname=id=>person(id)?.name||id||'—';
const first=id=>{const n=pname(id).split(' ');return n.length>1?n[0]+' '+n[n.length-1][0]+'.':n[0];};
const week=()=>S.weeks[S.weekId];
const slotId=(loc,sh,d)=>`${loc}.${sh}.${d}`;
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
function buildTurns(cfg,roster){
  const eligible=roster.filter(p=>p.active!==false).sort((a,b)=>b.bls-a.bls);
  const ppr=perRound(cfg); const turns=[]; for(let r=0;r<ppr.length;r++){ const order=(cfg.snake&&r%2===1)?[...eligible].reverse():eligible; for(const p of order){ if((p.skipped||0)>r) continue; for(let k=1;k<=ppr[r];k++) turns.push({round:r+1,personId:p.id,pick:k,of:ppr[r]}); } }
  return {turns,excluded:[]};
}
function perRound(cfg){ const a=Array.isArray(cfg.picksPerRound)&&cfg.picksPerRound.length?cfg.picksPerRound.map(n=>Math.max(1,+n||1)):Array(cfg.rounds||1).fill(1); return a; }
const shiftsPerPerson=cfg=>perRound(cfg).reduce((a,b)=>a+b,0);
function currentTurn(w){ if(!w||w.status!=='open') return -1; for(let i=0;i<w.turns.length;i++){ if(!w.picks[i]&&!w.passed[i]) return i; } return -1; }
function picksBySlot(w){ const m={}; for(const i in w.picks) m[w.picks[i].slot]={turn:+i,personId:w.turns[i].personId,...w.picks[i]}; return m; }
function countFor(w,pid){ let n=0; for(const i in w.picks) if(w.turns[i].personId===pid) n++; return n; }
const isClosed=(w,slot)=>!!(w.blocked&&w.blocked[slot]);
const addDays=(s,n)=>{ const [y,m,d]=s.split('-').map(Number); return iso(new Date(y,m-1,d+n)); };
function periodDays(w){ if(w&&Array.isArray(w.days)&&w.days.length) return w.days; const cfg=S.config; return cfg.days.map((d,i)=>({key:d,label:d,week:1,date:w?addDays(w.weekOf,i):null})); }
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const weekdayOf=s=>{ const [y,m,d]=s.split('-').map(Number); return WD[new Date(y,m-1,d).getDay()]; };
function makeDays(start,weeks){ const out=[]; for(let k=0;k<weeks;k++) for(let i=0;i<7;i++){ const date=addDays(start,k*7+i); const d=weekdayOf(date); out.push({key:`w${k+1}-${d}`,label:d,week:k+1,date}); } return out; }
const fmtLong=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); };
const dayLabel=key=>key.replace(/^w\d+-/,'');
const periodWeeks=w=>Math.max(1,...periodDays(w).map(d=>d.week||1));
const periodEnd=w=>addDays(w.weekOf,periodWeeks(w)*7-1);
const fmtRange=w=>`${fmtLong(w.weekOf)} – ${fmtLong(periodEnd(w))}`;
const isOff=(pid,dayKey)=>!!(person(pid)?.offDays||[]).includes(dayLabel(dayKey));
function dayTaken(w,pid,dayKey){ for(const i in w.picks){ if(w.turns[i].personId===pid&&w.picks[i].slot.split('.')[2]===dayKey) return true; } return false; }
const qualifier=w=>w.qualifier||null;
const locName=id=>(S.config.locations.find(l=>l.id===id)||{}).name||id;
function qualifierState(w,t){ // {required:bool, satisfied:bool, mustNow:bool}
  const q=qualifier(w); if(!q||t<0) return {required:false}; const turn=w.turns[t]; if(turn.round!==1) return {required:false}; const pid=turn.personId;
  let have=0; for(const i in w.picks){ if(w.turns[i].personId===pid&&w.turns[i].round===1&&w.picks[i].slot.split('.')[0]===q) have++; }
  let remaining=0; for(let i=t;i<w.turns.length;i++){ const x=w.turns[i]; if(x.round!==1) break; if(x.personId===pid&&!w.picks[i]&&!w.passed[i]) remaining++; }
  const mustNow=have===0&&remaining<=1; return {required:true,satisfied:have>0,mustNow,store:q};
}
function openQualifierCells(w,pid){ const q=qualifier(w); if(!q) return 0; const bySlot=picksBySlot(w); let n=0; for(const sh of S.config.shifts) for(const d of periodDays(w)){ const id=slotId(q,sh.id,d.key); if(!bySlot[id]&&!isClosed(w,id)&&!isOff(pid,d.key)&&!(S.config.maxPerDay&&dayTaken(w,pid,d.key))) n++; } return n; }
const clockMs=()=>Math.max(0,(+S.config.clockMinutes||0))*60000;
function clockLeft(w){ if(!clockMs()||!w.turnStartedAt) return null; return clockMs()-(Date.now()-Date.parse(w.turnStartedAt)); }
const stamp=nw=>{ nw.turnStartedAt=new Date().toISOString(); return nw; };

// ---------- Supabase data layer (same doc/collection shape the board was written against) ----------
function makeDB(sb){
  const subs={}, cache={}, clone=x=>JSON.parse(JSON.stringify(x));
  const emit=col=>{ const docs=Object.entries(cache[col]||{}).map(([id,d])=>({id,exists:true,data:()=>clone(d)})); (subs[col]||[]).forEach(fn=>fn({docs})); };
  const load=async col=>{ const {data,error}=await sb.from('docs').select('id,data').eq('collection',col); if(error) throw error; cache[col]={}; for(const r of data) cache[col][r.id]=r.data; };
  sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{ const row=p.eventType==='DELETE'?p.old:p.new; if(!row||!row.collection) { Object.keys(subs).forEach(c=>load(c).then(()=>emit(c)).catch(()=>{})); return; } const col=row.collection; cache[col]||={}; if(p.eventType==='DELETE') delete cache[col][row.id]; else cache[col][row.id]=p.new.data; emit(col); }).subscribe();
  const fail=e=>{ const err=new Error(e.message||String(e)); err.code=e.code==='42501'||/row-level security|permission/i.test(e.message||'')?'invalid_argument':(e.code||'unavailable'); throw err; };
  return {
    doc:path=>{ const [col,id]=path.split('/'); return {
      get:async()=>{ const {data,error}=await sb.from('docs').select('data').eq('collection',col).eq('id',id).maybeSingle(); if(error) fail(error); return {exists:!!data,data:()=>data?clone(data.data):undefined}; },

  sb.auth.onAuthStateChange((_e,sess)=>{ const u=sess?.user||null; const changed=(u?.id||null)!==(S.authUser?.id||null); S.authUser=u; if(changed){ if(u) startData(); else { S.loaded=false; S.gate=true; render(); } } });

}
function startData(){

}
function ready(timer){ clearTimeout(timer); S.loaded=true; if(!S.weekId||!S.weeks[S.weekId]){ const ids=Object.keys(S.weeks).sort(); S.weekId=ids.find(i=>S.weeks[i].status==='open')||ids[ids.length-1]||null; } if(S.view!=='board'||!S.editLayout) render(); }

async function claim(slot){
  const w=week(); const t=currentTurn(w); if(t<0) return; const pid=w.turns[t].personId;
  if(!(S.admin||S.me===pid)){ toast(`It is ${first(pid)}'s pick`); return; }
  const fresh=JSON.parse(JSON.stringify((await S.db.doc('weeks/'+S.weekId).get()).data()||w)); if(Object.values(fresh.picks).some(p=>p.slot===slot)){ toast('Someone just took that shift'); return; }
  if(currentTurn(fresh)!==t){ toast('The turn moved on; try again'); return; }
  const day=slot.split('.')[2]; if(isClosed(fresh,slot)){ toast('That shift is closed this period'); return; } if(isOff(pid,day)){ toast(`${first(pid)} is marked off on ${dayLabel(day)}`); return; } if(S.config.maxPerDay&&dayTaken(fresh,pid,day)){ toast(`${first(pid)} already has a ${dayLabel(day)} shift`); return; }
  const qs=qualifierState(fresh,t); if(qs.required&&qs.mustNow&&slot.split('.')[0]!==qs.store&&openQualifierCells(fresh,pid)>0){ toast(`This pick must be at ${locName(qs.store)}, the qualifier store`); return; }
  const nw=stamp(JSON.parse(JSON.stringify(fresh))); nw.picks[t]={slot,at:new Date().toISOString(),by:S.me||'admin'}; nw.log=(nw.log||[]).concat([{at:nw.picks[t].at,text:`${pname(pid)} took ${slotText(slot)} (round ${w.turns[t].round})`}]).slice(-200);
  if(currentTurn(nw)<0) nw.status='complete';
  S.weeks[S.weekId]=nw; if(await saveWeek(nw)) toast(`${first(pid)}: ${slotText(slot)}`); render();
}
const slotText=slot=>{ const [l,sid,d]=slot.split('.'); return `${l} ${dayLabel(d)}${/^w2/.test(d)?' (wk 2)':''} ${S.config.shifts.find(x=>x.id===sid)?.weekday||sid}`; };
async function pass(auto){
  const w=week(); const t=currentTurn(w); if(t<0) return; const pid=w.turns[t].personId; if(!(S.admin||S.me===pid||auto)) return;
  const nw=stamp(JSON.parse(JSON.stringify(w))); nw.passed[t]=true; nw.log=(nw.log||[]).concat([{at:new Date().toISOString(),text:`${pname(pid)} ${auto===true?'ran out of time and was passed':'passed'} (round ${w.turns[t].round})`}]); if(currentTurn(nw)<0) nw.status='complete';

}
async function undo(){

  const nw=stamp(JSON.parse(JSON.stringify(w))); const was=nw.picks[last]?`pick ${slotText(nw.picks[last].slot)}`:'pass'; delete nw.picks[last]; delete nw.passed[last]; nw.status='open'; nw.log=(nw.log||[]).concat([{at:new Date().toISOString(),text:`Undid ${pname(w.turns[last].personId)}'s ${was}`}]);
  S.weeks[S.weekId]=nw; if(await saveWeek(nw)) toast('Undone'); render();
}

}

async function movePeriod(newStart){

// Minimal PDF writer: Helvetica text, rectangles, lines; letter landscape.
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function MiniPDF(w,h){ this.w=w; this.h=h; this.pages=[]; this.cur=null; }
MiniPDF.prototype={
  ascii(t){ return String(t).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/·/g,'-').replace(/[^\x20-\x7E]/g,'?'); },
  width(t,size){ let w=0; for(const ch of this.ascii(t)) w+=(HW[ch.charCodeAt(0)-32]||556); return w*size/1000; },
  page(){ this.cur=[]; this.pages.push(this.cur); return this; },
  col(c){ return c.map(v=>(v/255).toFixed(3)).join(' '); },
  text(x,y,t,o={}){ const size=o.size||9, font=o.bold?'F2':'F1'; let s=this.ascii(t); const max=o.maxWidth; if(max){ while(s.length>1&&this.width(s,size)>max) s=s.slice(0,-2)+'…'.replace('…','.'); }
    const tw=this.width(s,size); let X=x; if(o.align==='center') X=x-tw/2; else if(o.align==='right') X=x-tw; const Y=this.h-y;
    this.cur.push(`BT /${font} ${size} Tf ${this.col(o.color||[0,0,0])} rg ${X.toFixed(2)} ${Y.toFixed(2)} Td (${s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}) Tj ET`); },
  rect(x,y,w,h,o={}){ const Y=this.h-y-h; const ops=[]; if(o.fill) ops.push(`${this.col(o.fill)} rg`); if(o.stroke) ops.push(`${this.col(o.stroke)} RG ${o.lw||0.5} w`); this.cur.push(`${ops.join(' ')} ${x.toFixed(2)} ${Y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${o.fill&&o.stroke?'B':o.fill?'f':'S'}`); },
  line(x1,y1,x2,y2,c,lw){ this.cur.push(`${this.col(c||[0,0,0])} RG ${lw||0.5} w ${x1.toFixed(2)} ${(this.h-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.h-y2).toFixed(2)} l S`); },
  blob(){ const objs=[]; const add=o=>{ objs.push(o); return objs.length; };
    const font1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'); const font2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesIdx=objs.length+1+this.pages.length*2; const kids=[];
    for(const p of this.pages){ const stream=p.join('\n'); const c=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`); const pg=add(`<< /Type /Page /Parent ${pagesIdx} 0 R /MediaBox [0 0 ${this.w} ${this.h}] /Contents ${c} 0 R /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> >>`); kids.push(pg+' 0 R'); }

};
function buildPdf(){
  const w=week(); const cfg=S.config; const bySlot=picksBySlot(w); const W=792,H=612,M=36; const pdf=new MiniPDF(W,H).page();
  const ink=[27,26,23], mute=[110,108,100], line=[200,198,190], locCol={AW:[14,124,134],CH:[110,68,168],WR:[184,106,11]}, locSoft={AW:[214,238,240],CH:[231,221,245],WR:[247,230,204]};
  const nW=periodWeeks(w); const allDays=periodDays(w);
  const timeW=96, cellW=(W-2*M-timeW)/cfg.days.length, rowH=22; let y;
  for(let wk=1;wk<=nW;wk++){ if(wk>1) pdf.page(); y=M; const days=allDays.filter(d=>(d.week||1)===wk);
    pdf.text(M,y+6,`${cfg.teamName} - shift draft, ${nW>1?`week ${wk} of ${nW}, `:''}week of ${fmtDate(days[0].date||w.weekOf)}`,{size:18,bold:true,color:ink});
    pdf.text(M,y+22,`${Object.keys(w.picks).length} of ${w.turns.length} picks - ${w.status}${qualifier(w)?' - qualifier store '+locName(qualifier(w)):''} - saved ${new Date().toLocaleString('en-US')}`,{size:9,color:mute}); y+=40;
    for(const loc of cfg.locations){
      if(y+rowH*(cfg.shifts.length+1)+30>H-M){ pdf.page(); y=M; }
      pdf.text(M,y+12,loc.name+(qualifier(w)===loc.id?'  (qualifier)':''),{size:12,bold:true,color:locCol[loc.id]||ink}); y+=18;
      days.forEach((d,i)=>pdf.text(M+timeW+i*cellW+cellW/2,y+10,d.label.toUpperCase()+(d.date?' '+(+d.date.slice(8)):''),{size:8,bold:true,color:mute,align:'center'})); y+=14;
      for(const sh of cfg.shifts){ pdf.line(M,y,W-M,y,line);
        pdf.text(M,y+9,sh.weekday,{size:8,color:ink}); pdf.text(M,y+17,'Sun '+sh.sunday,{size:6.5,color:mute});
        days.forEach((d,i)=>{ const id=slotId(loc.id,sh.id,d.key); const p=bySlot[id]; const x=M+timeW+i*cellW; if(p){ pdf.rect(x+2,y+2,cellW-4,rowH-4,{fill:locSoft[loc.id]||[235,235,235],stroke:locCol[loc.id]||ink}); pdf.text(x+cellW/2,y+rowH/2+3,pname(p.personId),{size:8.5,bold:true,color:ink,align:'center',maxWidth:cellW-8}); } else if(isClosed(w,id)){ pdf.rect(x+2,y+2,cellW-4,rowH-4,{fill:[232,231,226],stroke:line}); pdf.text(x+cellW/2,y+rowH/2+3,'closed',{size:7,color:mute,align:'center'}); } else pdf.rect(x+2,y+2,cellW-4,rowH-4,{stroke:line}); });
        y+=rowH; }
      pdf.line(M,y,W-M,y,line); y+=16; } }
  pdf.page(); y=M; pdf.text(M,y+6,'Shifts by person',{size:14,bold:true,color:ink}); y+=24;
  const people=[...new Set(w.turns.map(t=>t.personId))]; const colW=(W-2*M)/2; let col=0, y0=y;
  for(const pid of people){ const mine=Object.values(bySlot).filter(p=>p.personId===pid).sort((a,b)=>a.turn-b.turn).map(p=>{ const [l,sid,d]=p.slot.split('.'); const sh=cfg.shifts.find(x=>x.id===sid); const dl=dayLabel(d); return `${nW>1?'wk'+(d.match(/^w(\d)/)?.[1]||1)+' ':''}${dl} ${l} ${dl==='Sun'?sh.sunday:sh.weekday}`; });
    if(y>H-M-30){ col++; y=y0; if(col>1){ pdf.page(); y=M; y0=y; col=0; } } const x=M+col*colW;
    pdf.text(x,y+8,`${pname(pid)}  (${mine.length})`,{size:9.5,bold:true,color:ink});
    const lines=[]; let cur=''; for(const m of (mine.length?mine:['no shifts picked'])){ const t=cur?cur+'  -  '+m:m; if(pdf.width(t,8)>colW-20&&cur){ lines.push(cur); cur=m; } else cur=t; } if(cur) lines.push(cur);
    lines.forEach((l,i)=>pdf.text(x,y+20+i*11,l,{size:8,color:mute})); y+=22+lines.length*11; }
  return pdf.blob();
}

async function issueCode(email){ const {data,error}=await S.sb.rpc('issue_login_code',{target_email:normEmail(email)}); return {code:data,error:error?error.message:null}; }
async function redeemCode(email,code,password){ const {error}=await S.sb.rpc('redeem_login_code',{e:normEmail(email),code:String(code||''),new_password:password}); return error?error.message:null; }
async function requestCode(email){ const {error}=await S.sb.rpc('request_login_code',{e:normEmail(email)}); return error?error.message:null; }
async function loadRequests(){ try{ const {data}=await S.sb.rpc('pending_code_requests'); S.requests=(data||[]).map(r=>normEmail(r.email)); }catch(e){ S.requests=[]; } }
function refreshAdmin(){ const me=S.roster.find(p=>normEmail(p.email)===S.email&&p.active!==false)||null; S.me=me?me.id:null; S.admin=!!(me&&me.isAdmin); S.owner=!!(S.config&&normEmail(S.config.ownerEmail)===S.email); if(S.owner) S.admin=true; }
function render(){
  $('#teamName').textContent=(S.config?.teamName||'Team')+' Draft';
  const m=$('#main'); m.innerHTML='';
  if(S.gate){ document.querySelectorAll('#tabs a').forEach(a=>a.hidden=true); $('.me').hidden=true; renderGate(); return; }
  if(!S.config){ document.querySelectorAll('#tabs a').forEach(a=>a.hidden=true); $('.me').hidden=true; m.innerHTML=`<div class="empty"><h2>Nothing to show for ${esc(S.email)}</h2><p class="muted">Either this email is not on the team roster yet, or the database has not been set up. If you are a teammate, ask an admin to add your email on the Roster tab and sign in again.</p><button class="btn" id="signOut2">Sign out</button></div>`; $('#signOut2').onclick=signOut; return; }
  refreshAdmin();
  const locked=!S.admin; if(locked&&S.view!=='board'){ S.view='board'; }
  document.querySelectorAll('#tabs a').forEach(a=>{ a.hidden=locked&&a.dataset.view!=='board'; if(a.dataset.view===S.view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const meBox=$('.me'); $('#meSel').hidden=true; meBox.hidden=false;
  let fixed=$('#meFixed'); if(!fixed){ fixed=document.createElement('span'); fixed.id='meFixed'; meBox.insertBefore(fixed,$('#meSel')); }
  fixed.innerHTML=`<b>${S.me?esc(pname(S.me)):esc(S.email)}</b> <button class="btn small" id="setPassBtn">Reset password</button> <button class="btn small" id="signOut">Sign out</button>`; $('#signOut').onclick=signOut; $('#setPassBtn').onclick=e=>{ e.preventDefault(); S.setPass=true; render(); $('#setPassPanel')?.scrollIntoView({block:'start'}); $('#np1')?.focus(); };
  const ap=$('#adminPill'); ap.hidden=!S.admin; ap.textContent=S.owner?'owner':'admin';
  if(!S.me){ m.innerHTML=`<div class="empty"><h2>You're signed in, but not on the roster</h2><p class="muted">${esc(S.email)} doesn't match any active person's email. Ask an admin to add it on the Roster tab, then sign in again.</p></div>`; return; }
  ({board:renderBoard,roster:renderRoster,weeks:renderWeeks,settings:renderSettings})[S.view](); renderSetPassword();
}
function renderGate(){
  const m=$('#main'); let remembered=''; try{ remembered=localStorage.getItem('draft.email')||''; }catch(e){}
  const step=S.gateStep||'password';
  m.innerHTML=`<form class="gate" id="gateForm"><div><div class="eyebrow">Shift draft</div><h2>${step==='code'?'First sign-in or password reset':'Sign in to the draft'}</h2><p class="muted" style="margin:6px 0 0">${step==='code'?'Enter the one-time code an admin gave you and choose your password. The code works once and lasts 24 hours.':'Enter your email and password.'}</p></div>
    <label>Your email<input type="email" id="gEmail" value="${esc(remembered)}" autocomplete="username" required placeholder="name@company.com"></label>
    ${step==='code'?`<label>One-time code<input class="code" id="gCode" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="123456" required></label><label>Choose a password (8+ characters)<input type="password" id="gPass" autocomplete="new-password" minlength="8" required></label><label>Repeat the password<input type="password" id="gPass2" autocomplete="new-password" minlength="8" required></label>`:`<label>Password<input type="password" id="gPass" autocomplete="current-password" required></label>`}
    <div class="err" id="gErr" hidden></div>
    <button class="btn primary" type="submit" id="gBtn">${step==='code'?'Set password and sign in':'Sign in'}</button>
    ${step==='code'?'<button class="btn" type="button" id="gAlt" data-step="password">I already have a password</button><button class="btn" type="button" id="gReq">I have no code: ask an admin for one</button>':'<button class="btn" type="button" id="gAlt" data-step="code">First time here, or forgot your password?</button>'}
    <p class="faint" style="margin:0;font-size:12px">Only people on the team roster can get in. Admins issue one-time codes from the Roster tab; that is also how a password gets reset.</p></form>`;
  $('#gAlt').addEventListener('click',e=>{ S.gateStep=e.currentTarget.dataset.step; render(); });
  $('#gReq')?.addEventListener('click',async()=>{ const email=normEmail($('#gEmail').value); const err=$('#gErr'); if(!email){ err.textContent='Enter your email first.'; err.hidden=false; return; } const msg=await requestCode(email); err.textContent=msg||'Your admins have been notified. They will send you a code.'; err.style.color=msg?'':'var(--good)'; err.hidden=false; });
  $('#gateForm').addEventListener('submit',async e=>{ e.preventDefault(); const err=$('#gErr'); err.style.color=''; const btn=$('#gBtn'); const label=btn.textContent; btn.disabled=true; btn.textContent='Working…'; const fail=msg=>{ err.textContent=msg; err.hidden=false; btn.disabled=false; btn.textContent=label; };
    const email=normEmail($('#gEmail').value); const password=$('#gPass').value; if(!email||!password){ fail('Enter your email and password.'); return; }
    if(step==='code'){ if(password!==$('#gPass2').value){ fail('The two passwords do not match.'); return; } const msg=await redeemCode(email,$('#gCode').value,password); if(msg){ fail(/wrong code/i.test(msg)?'That code is wrong. Check it and try again (5 tries, then the code is cancelled).':/no active code/i.test(msg)?'No active code for that email. Ask an admin for a new one.':msg); return; } }
    const {error}=await S.sb.auth.signInWithPassword({email,password}); if(error){ fail(/invalid/i.test(error.message)?'Wrong email or password. First time here? Use the first-time option to set one with your code.':error.message); return; }
    try{ localStorage.setItem('draft.email',email); }catch(x){} S.gateStep='password'; toast('Signed in'); });
}
function renderSetPassword(){
  const m=$('#main'); if(!S.setPass) return; const box=document.createElement('div'); box.className='panel'; box.id='setPassPanel';
  box.innerHTML=`<header><h2>Reset the password for ${esc(S.email)}</h2><span class="faint">Change the password you sign in with</span></header><form class="form" id="setPassForm" style="border-top:0"><label>New password (8+ characters)<input type="password" id="np1" minlength="8" autocomplete="new-password" required></label><label>Repeat it<input type="password" id="np2" minlength="8" autocomplete="new-password" required></label><div class="actions"><button class="btn" type="button" id="npCancel">Cancel</button><button class="btn primary" type="submit">Save password</button></div></form>`;
  m.prepend(box);
  $('#npCancel').addEventListener('click',()=>{ S.setPass=false; render(); });
  $('#setPassForm').addEventListener('submit',async e=>{ e.preventDefault(); const a=$('#np1').value,b=$('#np2').value; if(a!==b){ toast('The two passwords do not match'); return; } const {error}=await S.sb.auth.updateUser({password:a}); if(error){ toast('Could not save: '+error.message); return; } S.setPass=false; toast('Password changed. Use the new one next time you sign in.'); render(); });
}

  const t=currentTurn(w); const pid=t>=0?w.turns[t].personId:null; const bySlot=picksBySlot(w); const isMine=pid&&pid===S.me; const canAct=t>=0&&!S.readOnly&&(S.admin||isMine);
  const picked=Object.keys(w.picks).length, totalSlots=cfg.locations.length*cfg.shifts.length*periodDays(w).length;

  const lastIdx=Math.max(-1,...Object.keys(w.picks).map(Number)); const latestSlot=lastIdx>=0?w.picks[lastIdx].slot:null;
  const nextUp=t>=0?w.turns.slice(t+1).filter((x,i,arr)=>!w.picks[t+1+i]&&!w.passed[t+1+i]).slice(0,3):[];

      ${w.status==='open'&&qs.required?`<div class="meta" style="margin-top:6px"><span class="pill ${mustQ?'crit':qs.satisfied?'good':'warn'}">${qs.satisfied?`${locName(qs.store)} qualifier done`:mustQ?`This pick must be at ${locName(qs.store)} (qualifier store)`:`Round 1: one of ${first(pid)}'s picks must be at ${locName(qs.store)}`}</span></div>`:''}</div>

    <div class="acts">${canAct?`<span class="pill clock">${isMine?'Your pick: tap an open shift':'Admin: pick for '+first(pid)}</span><button class="btn small" id="passBtn">Pass</button>`:''}${S.admin&&!S.readOnly&&(picked||Object.keys(w.passed).length)?'<button class="btn small" id="undoBtn">Undo last</button>':''}${!S.me&&w.status==='open'?'<span class="pill warn">Choose your name above to pick</span>':''}<button class="btn small" id="pdfBtn">Save PDF</button><button class="btn small" id="pdfPrev">Preview PDF</button>${S.admin&&!S.readOnly&&w.status==='open'?'<button class="btn small" id="rebuildBtn" title="Rebuild the draft order from the roster ranking">Rebuild order</button>':''}${S.admin&&!S.readOnly?(S.confirm==='reset'?`<span class="confirm">Clear all ${picked} picks? <button class="btn small danger" id="resetYes">Yes, clear the board</button><button class="btn small" id="resetNo">Keep</button></span>`:'<button class="btn small danger" id="resetBtn">Reset week</button>'):''}</div>
  </div>

  // grid

  for(const loc of cfg.locations){ g+=`<tr class="loc-${loc.id}"><th class="loc" colspan="${days.length+1}">${esc(loc.name)}${qualifier(w)===loc.id?'<span class="qbadge">Qualifier</span>':''}</th></tr>`;

      for(const d of days){ const id=slotId(loc.id,sh.id,d.key); const p=bySlot[id]; const closed=!p&&isClosed(w,id); const off=!p&&!closed&&canAct&&isOff(pid,d.key); const needQ=!p&&!closed&&!off&&canAct&&mustQ&&loc.id!==qualifier(w); const blocked=!p&&!closed&&!off&&!needQ&&canAct&&cfg.maxPerDay&&dayTaken(w,pid,d.key);
        const live=S.editLayout?(!p?'layout':''):(canAct&&!p&&!closed?'live':'');
        g+=`<td class="${d.label===cfg.days[0]&&nWeeks>1?'d1':''}"><div class="slot ${p?'taken':closed?'closed':'open'} ${live} ${p&&p.personId===S.me?'mine':''} ${id===latestSlot?'latest':''} ${blocked||off||needQ?'blocked':''} ${!p&&!closed&&mustQ&&loc.id===qualifier(w)&&canAct?'q':''}" ${live&&!blocked&&!off&&!needQ?'tabindex="0" role="button"':''} data-slot="${id}" title="${p?esc(pname(p.personId))+' · round '+w.turns[p.turn].round:closed?'Closed this period':esc(loc.name)+' '+d.label+' '+sh.weekday}">${p?esc(first(p.personId)):closed?'closed':off?'off '+d.label:needQ?esc(locName(qualifier(w)))+' first':blocked?'has '+d.label:''}</div></td>`; }
      g+='</tr>'; } }
  g+='</tbody></table>'; $('#gridWrap').innerHTML=g;
  const gw=$('#gridWrap');

function renderShare(){
  const panel=$('#sharePanel'); if(!panel) return; if(!S.sharing){ panel.hidden=true; panel.innerHTML=''; return; }
  const people=S.roster.filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name)); S.codes=S.codes||{}; const req=S.requests||[];
  panel.hidden=false; panel.innerHTML=`<div class="form" style="display:block"><h3 style="margin:0 0 4px">Login codes</h3><p class="muted" style="margin:0 0 8px">Issue a one-time code and pass it on (text, call, in person). The person enters it on the sign-in page with a password of their choice. Issuing a new code is also how you reset someone's password. Codes last 24 hours and show here only until you close this panel.</p>
    <div class="scroll"><table class="codes"><thead><tr><th>Person</th><th>Email</th><th>Code</th><th></th></tr></thead><tbody>${people.map(p=>`<tr><td>${esc(p.name)}${req.includes(normEmail(p.email))?' <span class="pill warn">asked for a code</span>':''}</td><td class="muted">${p.email?esc(p.email):'<span class="pill crit">no email</span>'}</td><td>${S.codes[p.id]?`<span class="c">${esc(S.codes[p.id])}</span>`:'<span class="faint">—</span>'}</td><td>${p.email?`<button class="btn small" data-code="${p.id}">${S.codes[p.id]?'New code':'Issue code'}</button>`:''}</td></tr>`).join('')}</tbody></table></div>
    <div class="actions"><button class="btn" id="codesCopy" ${Object.keys(S.codes).length?'':'disabled'}>Copy list</button><button class="btn" id="codesAll">Issue codes for everyone without one</button><button class="btn primary" id="shareClose">Close</button></div></div>`;
  panel.querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',async()=>{ const p=person(b.dataset.code); b.disabled=true; const {code,error}=await issueCode(p.email); if(error){ toast(error); b.disabled=false; return; } S.codes[p.id]=code; S.requests=(S.requests||[]).filter(e=>e!==normEmail(p.email)); renderShare(); }));
  $('#codesAll').addEventListener('click',async()=>{ for(const p of people){ if(!p.email||S.codes[p.id]) continue; const {code}=await issueCode(p.email); if(code) S.codes[p.id]=code; } S.requests=[]; renderShare(); toast('Codes issued'); });
  $('#codesCopy').addEventListener('click',async()=>{ const txt=people.filter(p=>S.codes[p.id]).map(p=>`${p.name}: ${S.codes[p.id]}`).join('\n'); try{ await navigator.clipboard.writeText(txt); toast('Copied'); }catch(e){ toast('Could not copy; select the table instead'); } });
  $('#shareClose').addEventListener('click',()=>{ S.sharing=false; S.codes={}; render(); });
}
function renderRoster(){
  const m=$('#main'); const cfg=S.config; const sorted=[...S.roster].sort((a,b)=>b.bls-a.bls); const edit=S.editRoster&&S.admin&&!S.readOnly;
  m.insertAdjacentHTML('beforeend',`<div class="panel"><header><h2>Roster and ranking</h2><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="faint">Draft order follows this ranking (BLS, highest first). Skipped rounds come off the top of a person's turns. Use "Rebuild order" on the Board to apply changes to the open period.</span>${S.admin&&!S.readOnly?`${edit?'<button class="btn small" id="cancelR">Cancel</button> <button class="btn small primary" id="editR">Save changes</button>':'<button class="btn small" id="editR">Edit</button> <button class="btn small primary" id="shareBtn">Login codes</button>'}`:''}</div></header><div id="sharePanel" hidden></div>
  <div class="body flush scroll"><table><thead><tr><th class="num">#</th><th>Name</th><th class="num">BLS</th><th>Email</th><th class="num">Skipped rounds</th><th>Days off</th><th>Status</th><th>Admin</th>${edit?'<th></th>':''}</tr></thead><tbody id="rosterRows">${sorted.map((p,i)=>{ const out=p.active===false; const edis=false; return `<tr data-id="${p.id}" class="${out?'muted':''}"><td class="num">${out?'':i+1}</td><td>${edit?`<input type="text" value="${esc(p.name)}" data-f="name">`:esc(p.name)}</td><td class="num">${edit?`<input type="number" value="${p.bls}" data-f="bls">`:p.bls.toLocaleString()}</td><td>${edit?`<input type="email" value="${esc(p.email||'')}" data-f="email" placeholder="name@example.com" style="width:200px;font-family:var(--body)">`:(p.email?esc(p.email):'<span class="pill warn">no email</span>')}</td><td class="num">${edit?`<input type="number" value="${p.skipped||0}" data-f="skipped" min="0">`:(p.skipped||0)}</td><td>${edit?`<div class="days">${cfg.days.map(d=>`<label><input type="checkbox" data-off="${d}" ${(p.offDays||[]).includes(d)?'checked':''}>${d}</label>`).join('')}</div>`:((p.offDays||[]).length?`<span class="pill crit">${p.offDays.join(', ')}</span>`:'<span class="faint">—</span>')}</td><td>${out?'<span class="pill neutral">inactive</span>':edis?`<span class="pill crit">sits out (E-DIS ${p.edis}%)</span>`:p.skipped?`<span class="pill warn">skips ${p.skipped} round${p.skipped>1?'s':''}</span>`:'<span class="pill good">eligible</span>'}</td><td>${edit?`<label class="days" style="display:inline-flex"><label><input type="checkbox" data-f="isAdmin" ${p.isAdmin?'checked':''}>admin</label></label>`:(p.isAdmin?'<span class="pill good">admin</span>':'<span class="faint">—</span>')}</td>${edit?`<td><button class="btn small" data-act="toggle">${out?'Activate':'Deactivate'}</button></td>`:''}</tr>`; }).join('')}</tbody></table></div>
  ${edit?`<div class="form"><label>New person<input type="text" id="npName" placeholder="Full name"></label><label>Email<input type="email" id="npEmail" placeholder="name@example.com"></label><label>BLS<input type="number" id="npBls" value="0"></label><div class="actions"><button class="btn" id="addP">Add to roster</button><button class="btn primary" id="saveR">Save changes</button></div></div>`:''}
  <p class="note">Changing BLS or skips here affects the next week you open; the current week keeps the order it started with. Days off apply right away: that person cannot pick a shift on those days.</p></div>`);
  renderShare(); $('#shareBtn')?.addEventListener('click',async()=>{ S.sharing=true; S.codes={}; await loadRequests(); render(); });
  let collectImpl=()=>{}; const collect=()=>collectImpl();
  const saveAll=async()=>{ collect(); if(await saveRoster()){ toast('Roster saved'); S.editRoster=false; render(); } };
  $('#editR')?.addEventListener('click',()=>{ if(edit) saveAll(); else { S.editRoster=true; render(); } });
  $('#cancelR')?.addEventListener('click',async()=>{ const snap=await S.db.doc('draft/roster').get(); if(snap.exists) S.roster=JSON.parse(JSON.stringify(snap.data().items||[])); S.editRoster=false; render(); });
  if(!edit) return;
  collectImpl=()=>{ document.querySelectorAll('#rosterRows tr').forEach(tr=>{ const p=person(tr.dataset.id); p.offDays=[...tr.querySelectorAll('input[data-off]:checked')].map(i=>i.dataset.off); tr.querySelectorAll('input[data-f]').forEach(inp=>{ const f=inp.dataset.f; if(f==='isAdmin'){ p.isAdmin=inp.checked; return; } if(f==='name') p.name=inp.value.trim()||p.name; else if(f==='email') p.email=inp.value.trim().toLowerCase(); else if(f==='edis') p.edis=inp.value===''?null:+inp.value; else p[f]=+inp.value||0; }); }); };
  $('#rosterRows').addEventListener('click',async e=>{ const b=e.target.closest('button[data-act]'); if(!b) return; collect(); const p=person(b.closest('tr').dataset.id); p.active=p.active===false; if(await saveRoster()) toast(p.active===false?p.name+' deactivated':p.name+' activated'); render(); });
  $('#addP').addEventListener('click',async()=>{ collect(); const name=$('#npName').value.trim(); if(!name) return; let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); let b=id,n=2; while(person(id)) id=b+'-'+(n++); S.roster.push({id,name,email:$('#npEmail').value.trim().toLowerCase(),bls:+$('#npBls').value||0,skipped:0,active:true,isAdmin:false}); if(await saveRoster()) toast('Added '+name); render(); });
  $('#saveR').addEventListener('click',saveAll);
}

function renderWeeks(){
  const m=$('#main'); const ids=Object.keys(S.weeks).sort().reverse(); const next=iso(mondayOf(new Date(Date.now()+7*864e5)));
  m.insertAdjacentHTML('beforeend',`<div class="panel"><header><h2>Draft periods</h2>${S.admin&&!S.readOnly?`<form class="confirm" id="newWeek"><label class="muted">Starts <input type="date" id="nwDate" value="${next}"></label><label class="muted">Length <select id="nwLen"><option value="1" ${(S.config.periodWeeks||2)===1?'selected':''}>1 week</option><option value="2" ${(S.config.periodWeeks||2)===2?'selected':''}>2 weeks</option></select></label><button class="btn primary small" type="submit">Open draft</button></form>`:''}</header>
  <div class="body flush scroll"><table><thead><tr><th>Period</th><th>Length</th><th>Status</th><th class="num">Picks</th><th class="num">Turns</th><th>Opened</th><th></th></tr></thead><tbody>${ids.map(id=>{ const w=S.weeks[id]; return `<tr><td><b>${fmtRange(w)}</b></td><td class="muted">${periodWeeks(w)===2?'2 weeks':'1 week'}</td><td><span class="pill ${w.status==='open'?'clock':w.status==='complete'?'good':'neutral'}">${w.status}</span></td><td class="num">${Object.keys(w.picks).length}</td><td class="num">${w.turns.length}</td><td class="muted">${new Date(w.createdAt).toLocaleDateString()}</td><td><button class="btn small" data-open="${id}">${id===S.weekId?'Viewing':'View'}</button>${S.pinned&&id===S.weekId?' <span class="faint">(pinned; the board stays here until you pick another)</span>':''}${S.admin&&!S.readOnly&&w.status==='open'?` <button class="btn small danger" data-close="${id}">Close</button>`:''}</td></tr>`; }).join('')||'<tr><td colspan="7" class="muted">No draft periods yet.</td></tr>'}</tbody></table></div>
  <p class="note">A period can start on any day; the grid's columns follow from the start date. Opening a new period builds the draft order from the roster ranking as it stands now, closes any period still open, and every open copy of the board switches to it. The start date of an open period can be changed from the Board.</p></div>`);
  m.addEventListener('click',async e=>{ const o=e.target.closest('[data-open]'); if(o){ S.weekId=o.dataset.open; S.pinned=S.weeks[o.dataset.open]?.status!=='open'; S.scrolledOnce=false; location.hash='#board'; render(); return; } const c=e.target.closest('[data-close]'); if(c){ const w=S.weeks[c.dataset.close]; w.status='closed'; if(await write(()=>S.db.doc('weeks/'+w.weekOf).set(w))) toast('Period closed'); render(); } });
  $('#newWeek')?.addEventListener('submit',e=>{ e.preventDefault(); const d=$('#nwDate').value; if(!d) return; startWeek(d,+$('#nwLen').value); });
}

function renderAdmins(){
  const m=$('#main'); const admins=S.roster.filter(p=>p.isAdmin&&p.active!==false).sort((a,b)=>a.name.localeCompare(b.name)); const canManage=S.admin&&!S.readOnly;
  m.insertAdjacentHTML('beforeend',`<div class="panel"><header><h2>Admins</h2><span class="faint">Admins can pick for anyone, pass, undo, reset, close shifts, move the period and change these settings</span></header>
  <div class="body flush scroll"><table><thead><tr><th>Who</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>
    ${S.config.ownerEmail?`<tr><td><b>Board owner</b>${S.owner?' <span class="faint">(you)</span>':''}</td><td class="muted">${esc(S.config.ownerEmail)}</td><td><span class="pill good">always admin</span></td><td></td></tr>`:''}
    ${admins.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.id===S.me?' <span class="faint">(you)</span>':''}</td><td class="muted">${esc(p.email||'no email')}</td><td><span class="pill good">admin</span></td><td>${canManage?`<button class="btn small danger" data-rm="${p.id}">Remove</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No alternate admins yet.</td></tr>'}
  </tbody></table></div>
  ${canManage?`<div class="form"><label>Add an admin<select id="adminSel"><option value="">choose a person</option>${S.roster.filter(p=>p.active!==false&&!p.isAdmin).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}${p.email?'':' (no email yet)'}</option>`).join('')}</select></label><div class="actions"><button class="btn primary" id="adminAdd">Add admin</button></div></div>`:''}
  <p class="note">Admin rights follow the person's email: whoever signs in with that address gets the admin tools. A person needs an email on the roster before they can sign in at all.</p></div>`);
  if(!canManage) return;
  const setAdmin=async(pid,v)=>{ const p=person(pid); if(!p) return; p.isAdmin=v; if(await saveRoster()) toast(v?p.name+' is now an admin':p.name+' removed as admin'); render(); };
  $('#adminAdd').addEventListener('click',()=>{ const v=$('#adminSel').value; if(v) setAdmin(v,true); });
  m.addEventListener('click',e=>{ const r=e.target.closest('[data-rm]'); if(r) setAdmin(r.dataset.rm,false); });
}
function renderSettings(){
  renderAdmins();
  const m=$('#main'); const c=S.config; const ro=!(S.admin&&!S.readOnly);
  m.insertAdjacentHTML('beforeend',`<div class="panel"><header><h2>Draft rules</h2>${ro?'<span class="faint">Only an admin can change these</span>':''}</header>
  <form class="form" id="cfgForm" style="border-top:0">
    <label>Team name<input type="text" id="cTeam" value="${esc(c.teamName)}" ${ro?'disabled':''}></label>
    <label>Shifts picked per round (comma-separated, one number per round)<input type="text" id="cRounds" value="${perRound(c).join(', ')}" placeholder="2, 2, 1" ${ro?'disabled':''}></label>
    <label>Max shifts per person per day<input type="number" id="cMax" min="0" max="3" value="${c.maxPerDay||0}" ${ro?'disabled':''}></label>
        <label>Draft period length<select id="cPeriod" ${ro?'disabled':''}><option value="1" ${(c.periodWeeks||2)===1?'selected':''}>1 week</option><option value="2" ${(c.periodWeeks||2)===2?'selected':''}>2 weeks (biweekly)</option></select></label>
    <label>Qualifier store (round 1 must include one pick here)<select id="cQual" ${ro?'disabled':''}><option value="">none</option>${c.locations.map(l=>`<option value="${l.id}" ${c.qualifierStore===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
    <label>Minutes on the clock per pick (0 = no clock)<input type="number" id="cClock" min="0" max="120" value="${+c.clockMinutes||0}" ${ro?'disabled':''}></label>
    <label>When time runs out<select id="cAuto" ${ro?'disabled':''}><option value="0" ${!c.autoPass?'selected':''}>Show "time's up", admin decides</option><option value="1" ${c.autoPass?'selected':''}>Pass the turn automatically</option></select></label>
    <label>Board owner email (always admin)<input type="email" id="cOwner" value="${esc(c.ownerEmail||'')}" ${ro?'disabled':''}></label>
    <label>Order each round<select id="cSnake" ${ro?'disabled':''}><option value="0" ${!c.snake?'selected':''}>Same order every round</option><option value="1" ${c.snake?'selected':''}>Snake (reverse on even rounds)</option></select></label>
    ${ro?'':'<div class="actions"><button class="btn primary" type="submit">Save rules</button></div>'}
  </form>
  <p class="note">Period length, picks per round and the qualifier default apply when the next period is opened; the clock applies right away. "2, 2, 1" means everyone takes two shifts in round 1, two in round 2 and one in round 3 (${shiftsPerPerson(c)} each). 0 for max per day means no limit.</p></div>
  <div class="panel"><header><h2>Shift template</h2></header><div class="body flush scroll"><table><thead><tr><th>Row</th><th>Mon–Sat</th><th>Sunday</th></tr></thead><tbody>${c.shifts.map((s,i)=>`<tr><td class="num">${i+1}</td><td>${ro?esc(s.weekday):`<input type="text" value="${esc(s.weekday)}" data-sh="${s.id}" data-f="weekday">`}</td><td>${ro?esc(s.sunday):`<input type="text" value="${esc(s.sunday)}" data-sh="${s.id}" data-f="sunday">`}</td></tr>`).join('')}</tbody></table></div><div class="body"><span class="muted">Locations: ${c.locations.map(l=>esc(l.name)).join(', ')}. ${c.locations.length*c.shifts.length*c.days.length} cells per week.</span></div></div>`);
  if(ro) return;
  $('#cfgForm').addEventListener('submit',async e=>{ e.preventDefault(); c.teamName=$('#cTeam').value.trim()||c.teamName; { const arr=$('#cRounds').value.split(/[,\s]+/).map(n=>parseInt(n)).filter(n=>n>0); c.picksPerRound=arr.length?arr:[1]; c.rounds=c.picksPerRound.length; } c.maxPerDay=+$('#cMax').value||0; c.snake=$('#cSnake').value==='1'; c.periodWeeks=+$('#cPeriod').value||2; c.ownerEmail=$('#cOwner').value.trim().toLowerCase(); c.qualifierStore=$('#cQual').value||null; c.clockMinutes=Math.max(0,+$('#cClock').value||0); c.autoPass=$('#cAuto').value==='1'; document.querySelectorAll('input[data-sh]').forEach(i=>{ const s=c.shifts.find(x=>x.id===i.dataset.sh); if(s) s[i.dataset.f]=i.value.trim(); }); if(await saveConfig()) toast('Rules saved'); render(); });
}

route(); boot();
})();
</script>
</body>
</html>
